[project]
name = "bibleorgsys"
version = "0.1.0"
description = "Bible Organisational System (BOS) Python package"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["bibleorgsys-rust>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.workspace]
members = [".", "Rust/bible_organisational_system"]


[tool.uv.sources]
bibleorgsys-rust = { workspace = true }
