[project]
name = "bibleorgsys"
version = "0.3.0"
description = "Bible Organisational System — load, check, and/or export Bible files/folders"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
authors = [
    { name = "Robert Hunt", email = "Freely.Given.org+BOS@gmail.com" },
]
keywords = ["Bible", "Scripture", "check", "import", "export", "index", "book", "chapter", "verse", "USFM", "USX"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Religion",
    "Topic :: Religion",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "bibleorgsys-rust>=0.3.0",
    "bos_books_codes_py>=0.6.3",
    "usfm_markers_py>=0.3.0",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
]

[tool.uv]
exclude-newer = "7 days"
environments = [
    "python_version == '3.13'",
    "python_version == '3.14'"
]

[project.urls]
Homepage = "https://Freely-Given.org/Software/BibleOrganisationalSystem/"
Source = "https://github.com/Freely-Given-org/BibleOrgSys"

[project.scripts]
Bible2USX = "BibleOrgSys.Apps.Bible2USX:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["BibleOrgSys"]

[tool.hatch.build.targets.wheel.force-include]
"BibleOrgSys/DataFiles/DerivedFiles" = "BibleOrgSys/DataFiles/DerivedFiles"
"BibleOrgSys/DistributedFiles" = "BibleOrgSys/DistributedFiles"

[tool.uv.workspace]
members = [".", "Rust/bible_organisational_system"]

[tool.uv.sources]
bibleorgsys-rust = { workspace = true }
bos_books_codes_py = { path = "../BibleOrgSys/Rust/bos_books_codes_py", editable = true }
usfm_markers_py = { path = "Rust/usfm_markers_py", editable = true }

[dependency-groups]
dev = [
    "ty>=0.0.18",
]

[tool.setuptools]
py-modules = ["BibleOrgSysGlobals"] 
# This explicitly tells Python: "Treat this file as a top-level module"

