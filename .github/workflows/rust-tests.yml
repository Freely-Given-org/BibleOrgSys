name: Rust and Python Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Build and Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # If one version fails, keep the others running to see the full picture
      fail-fast: false 
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # This ensures each Python version gets its own separate cache
          key: ${{ matrix.python-version }}

      - name: Install Dependencies and Project
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          maturin develop 

      - name: Run Cargo Tests
        run: cargo test --verbose

      - name: Run Python Validation Script
        run: python Tests/test_OET-RV_HAG_indexes.py
