[package]
name = "bos-internals"
version = "0.1.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core internal data structures for Bible text representation, indexing, and manipulation"
keywords = ["bible", "usfm", "scripture"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
thiserror.workspace = true
regex = "1"
compact_str = "0.9"
indexmap = "2"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = "1"

[features]
default = []
python = ["dep:pyo3"]

# While we're still debugging
[profile.release]
debug = true

